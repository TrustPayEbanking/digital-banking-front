  <!-- Desktop Menu -->
  <div class="hidden md:flex items-center space-x-8">
    <ul class="flex space-x-6 lg:space-x-10">

        <a routerLink="" class="font-medium text-gray-700 hover:text-[#3C6E71] transition-colors">Home</a>

        <a routerLink="contact" class="font-medium text-gray-700 hover:text-[#3C6E71] transition-colors">About us</a>

<!-- Script pour le menu mobile -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const menuButton = document.getElementById('mobile-menu-button');
    const mobileMenu = document.getElementById('mobile-menu');

    if (menuButton) {
      menuButton.addEventListener('click', function() {
        mobileMenu.classList.toggle('hidden');
      });

      // Fermer le menu en cliquant à l'extérieur
      document.addEventListener('click', function(event) {
        if (!menuButton.contains(event.target) && !mobileMenu.contains(event.target)) {
          mobileMenu.classList.add('hidden');
        }
      });
    }
  });
</script>
