<div class="w-full h-screen flex">
  <div style="background-image: url('/images_entreprise.jpg'); background-size: cover; background-position: center;" class="w-1/2 h-full  flex flex-col bg-amber-400">
    <div class="w-full py-5 flex justify-between h-auto items-center px-10">
      <div class="w-auto h-auto items-center flex space-x-2.5">
        <img src="logo.png" width="60" height="60">
        <h1 class="text-white text-2xl font-medium">TrustPay</h1>
      </div>
      <a routerLink="" class="text-white underline">Back to site Web</a>
    </div>
    <div class="w-full h-full">

    </div>
    <div class="w-200 px-3 h-auto py-6">
      <h1 class="text-3xl  text-white font-medium">
        Optimize Your Account Management with Our Intelligent Digital Banking System      </h1>
    </div>
  </div>
  <div  style="background-image: url('/nuage.png'); background-size: cover; background-position: center;" class="w-1/2 h-full px-20 py-10">
    <div  class="w-full py-7 px-7 h-full space-y-5 flex flex-col bg-white rounded-2xl">

      <h1 class="text-3xl font-medium">Welcome Back !</h1>
      <p>Login in to start use the process of recturement</p>
      <div class="w-full px-10 mt-7 h-auto flex flex-col">
        <form [formGroup]="formLogin" (ngSubmit)="handleLogin()">
        <div class="w-full h-auto flex space-y-2 flex-col">
          <label>Username</label>
          <input  placeholder="Email addresse" type="text" formControlName="username" class="w-full rounded-xl h-15  border-1 pl-2 border-black">
        </div>
        <div class="w-full h-auto mt-10 flex space-y-2 flex-col">
          <label>Password</label>
          <input  placeholder="Password" type="password" formControlName="password" class="w-full rounded-xl h-15  border-1 pl-2 border-black">
        </div>
        <div class="w-full mt-6 space-y-4 h-auto px-10">
          <button  class="w-full h-13 rounded-2xl text-white  bg-black">Login</button>
      </div>
        </form>

      </div>
      <p class="text-center mt-2">Foregt Password ?</p>

      <p class="text-center mt-5">Dont't have account contact Us for more information ?</p>
      <a class="underline text-center">contact Us</a>
    </div>
  </div>
</div>
