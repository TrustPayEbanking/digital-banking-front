<div class="w-full h-screen flex">

  <div
    style="background-image: url('/images_entreprise.jpg'); background-size: cover; background-position: center;"
    class="w-1/2 h-full relative flex flex-col">

    <div class="absolute inset-0 bg-black/60"></div>

    <div class="relative z-10 w-full py-5 flex justify-between items-center px-10">
      <a routerLink="/" class="flex items-center space-x-2.5 cursor-pointer">
        <img src="logo.png" width="60" height="60">
        <h1 class="text-white text-2xl font-medium">TrustPay</h1>
      </a>
    </div>

    <div class="relative z-10 w-full h-full flex items-center justify-center px-10 text-center">
      <h1 class="text-3xl text-white font-medium max-w-xl">
        Optimize your account management with our intelligent digital banking system
      </h1>
    </div>

  </div>

  <div
    style="background-image: url('/nuage.png'); background-size: cover; background-position: center;"
    class="w-1/2 h-full px-20 py-10">

    <div class="w-full py-7 px-7 h-full space-y-5 flex flex-col bg-white rounded-2xl">

      <h1 class="text-3xl font-medium">Welcome back!</h1>
      <p>Log in to start using the digital banking platform.</p>

      <div class="w-full px-10 mt-7 h-auto flex flex-col">
        <form [formGroup]="formLogin" (ngSubmit)="handleLogin()">

          <div class="w-full h-auto flex space-y-2 flex-col">
            <label>Username</label>
            <input
              placeholder="Email address"
              type="text"
              formControlName="username"
              class="w-full rounded-xl h-15 border-1 pl-2 border-black">
          </div>

          <div class="w-full h-auto mt-10 flex space-y-2 flex-col">
            <label>Password</label>
            <input
              placeholder="Password"
              type="password"
              formControlName="password"
              class="w-full rounded-xl h-15 border-1 pl-2 border-black">
          </div>

          <div class="w-full mt-6 space-y-4 h-auto px-10">
            <button class="w-full h-13 rounded-2xl text-white bg-black">
              Log in
            </button>
          </div>

        </form>
      </div>

      <p class="text-center mt-2">Forgot password?</p>

      <p class="text-center mt-5">
        Don’t have an account?
      </p>

      <a
        routerLink="/login/account"
        class="underline text-center cursor-pointer">
        Create an account
      </a>

      <p class="text-center mt-3">
        Need help or more information?
      </p>

      <a
        routerLink="/contact"
        class="underline text-center cursor-pointer">
        Contact us
      </a>

    </div>

  </div>

</div>
