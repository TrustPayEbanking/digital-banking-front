<section
  class="w-full h-full flex flex-col justify-between
         bg-gradient-to-b from-[#0F1F1E] to-[#050A0A]
         rounded-tr-2xl rounded-br-2xl shadow-2xl"
>

  <div class="flex flex-col">
    <div class="flex items-center h-20 px-6 gap-3 border-b border-white/5">
      <img src="logo.png" class="w-9 h-9">
      <h1 class="text-white text-lg font-semibold tracking-wide">
        TrustPay
      </h1>
    </div>

    <div class="flex flex-col px-4 pt-6 space-y-1">
      <p class="text-[11px] text-white/40 uppercase tracking-widest px-3 mb-2">
        Main menu
      </p>

      <a
        routerLink="/dashbord"
        class="group flex items-center gap-4 px-4 h-11 rounded-xl
               text-sm text-white/70
               hover:text-white hover:bg-white/10 transition"
      >
        <lucide-icon name="House" size="20"></lucide-icon>
        Dashboard
      </a>

      <div class="flex flex-col">
        <button
          (click)="changeEtatdropedwon()"
          class="group flex items-center justify-between px-4 h-11 rounded-xl
                 text-sm text-white/70
                 hover:text-white hover:bg-white/10 transition"
        >
          <div class="flex items-center gap-4">
            <lucide-icon name="Workflow" size="20"></lucide-icon>
            Bank accounts
          </div>

          <lucide-icon
            name="ChevronRight"
            size="18"
            [class.rotate-90]="dropdown_departement"
            class="transition-transform text-white/60"
          ></lucide-icon>
        </button>

        @if (dropdown_departement) {
          <div class="ml-6 mt-2 flex flex-col space-y-1 border-l border-white/10 pl-4">
            <button
              class="flex items-center gap-3 h-9 text-sm text-white/60
                     hover:text-white transition"
            >
              <lucide-icon name="HandCoins" size="16"></lucide-icon>
              Saving account
            </button>

            <button
              class="flex items-center gap-3 h-9 text-sm text-white/60
                     hover:text-white transition"
            >
              <lucide-icon name="DollarSign" size="16"></lucide-icon>
              Current account
            </button>
          </div>
        }
      </div>

      <a
        routerLink="/dashbord/customers"
        class="group flex items-center gap-4 px-4 h-11 rounded-xl
               text-sm text-white/70
               hover:text-white hover:bg-white/10 transition"
      >
        <lucide-icon name="User" size="20"></lucide-icon>
        Customers
      </a>

      <a
        routerLink="/contact"
        class="group flex items-center gap-4 px-4 h-11 rounded-xl
               text-sm text-white/70
               hover:text-white hover:bg-white/10 transition"
      >
        <lucide-icon name="Phone" size="20"></lucide-icon>
        Contact
      </a>

      <a
        routerLink="/dashbord/transactions"
        routerLinkActive="bg-white/10 text-white"
        class="group flex items-center gap-4 px-4 h-11
         rounded-lg text-sm text-white/60
         hover:bg-white/5 hover:text-white transition"
      >
        <lucide-icon
          name="Send"
          size="20"
          class="text-white/40 group-hover:text-white"
        ></lucide-icon>

        <span>Transactions</span>
      </a>



      <a
        routerLink="/dashbord/operations"
        routerLinkActive="bg-white/10 text-white"
        class="group flex items-center gap-4 px-4 h-11
         rounded-lg text-sm text-white/60
         hover:bg-white/5 hover:text-white transition"
      >
        <lucide-icon name="Handshake" size="20"></lucide-icon>
        <span>Operations</span>
      </a>

    </div>
  </div>

  <div class="px-4 pb-5 space-y-2">
    <a
      routerLink="/dashbord/settings"
      routerLinkActive="bg-white/10 text-white"
      class="flex items-center gap-4 h-10 px-4 rounded-xl
         text-sm text-white/60 hover:text-white hover:bg-white/10 transition"
    >
      <lucide-icon name="Settings" size="20"></lucide-icon>
      <span>Settings</span>
    </a>



    <button
      class="flex items-center gap-4 h-10 px-4 rounded-xl
             text-sm text-white/60 hover:text-white hover:bg-white/10 transition"
    >
      <lucide-icon name="FileUser" size="20"></lucide-icon>
      Support
    </button>

    <button
      class="flex items-center gap-4 h-10 px-4 rounded-xl
             text-sm text-red-400 hover:bg-red-500/10 transition"
    >
      <lucide-icon name="LogOut" size="20"></lucide-icon>
      Log out
    </button>

    <div class="mt-4 flex items-center gap-3 px-3 py-3
                bg-white/5 rounded-2xl">
      <div class="w-11 h-11 rounded-full overflow-hidden ring-2 ring-white/10">
        <img src="avisclient/acis1.jpg" class="w-full h-full object-cover">
      </div>
      <div>
        <p class="text-sm text-white font-medium">
          Oussama Hamdane
        </p>
        <p class="text-xs text-white/50">
          Administrator
        </p>
      </div>
    </div>
  </div>

</section>
